<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; base-uri 'none'; form-action 'self'">

    <title>Secure XSS Training Lab</title>


<style>
body {
    font-family: Arial;
    background: #eee;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 800px;
    margin: auto;
}
h1 {
    text-align: center;
    color: #245b91;
}
.card {
    background: white;
    border: 1px solid #ccc;
    padding: 15px;
    margin: 15px 0;
}
label {
    display: block;
    margin-bottom: 8px;
}
textarea {
    width: 100%;
    height: 80px;
    padding: 8px;
    box-sizing: border-box;
}
button {
    padding: 8px 12px;
    background: #2868b2;
    color: white;
    border: none;
    cursor: pointer;
}
.output {
    margin-top: 10px;
    padding: 10px;
    background: #fafafa;
    border: 1px solid #ccc;
    overflow-wrap: anywhere;
}
.warning {
    padding: 10px;
    background: #fff4d6;
    border: 1px solid #e2c66d;
}
</style>


</head>
<body>
    <h1>Secure XSS Training Lab</h1>

  <p class="warning">
    This page treats all user input as text. It does not intentionally execute JavaScript.
  </p>

  <section class="card">
    <h2>Safe Reflected-Style Output</h2>

    <form id="messageForm">
      <label for="messageInput">Enter a message:</label>
      <textarea id="messageInput" maxlength="500"></textarea>
      <button type="submit">Display Message</button>
    </form>

    <div id="messageOutput" class="output"></div>
  </section>

  <section class="card">
    <h2>Safe DOM Output</h2>

    <label for="domInput">Enter another message:</label>
    <textarea id="domInput" maxlength="500"></textarea>
    <button id="domButton" type="button">Display Safely</button>

    <div id="domOutput" class="output"></div>
  </section>

  <section class="card">
    <h2>Validation Result</h2>

    <p id="status" class="success">
      No input has been submitted yet.
    </p>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
